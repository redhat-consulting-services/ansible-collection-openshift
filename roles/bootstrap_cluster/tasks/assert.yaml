---
- name: Assert type is valid
  ansible.builtin.assert:
    quiet: true
    that:
      - type | default('none') in ['none', 'baremetal']
    fail_msg: "Invalid type. Must be 'none' or 'baremetal'."

- name: Assert load balancer type is valid
  ansible.builtin.assert:
    quiet: true
    that:
      - lb_type | default('') in ['UserManaged', '']
    fail_msg: "Invalid load balancer type. Must be 'UserManaged' or ''."

- name: Assert that the combination between lb_type and api_vip/ingress_vip is valid
  ansible.builtin.assert:
    quiet: true
    that:
      - api_vip is not defined
      - ingress_vip is not defined
    fail_msg: "Invalid combination of lb_type, api_vip and ingress_vip. If lb_type is 'UserManaged', api_vip and ingress_vip must not be defined."
  when: lb_type | default('') == 'UserManaged'

- name: Assert that the combination between api_vip and ingress_vip is valid
  ansible.builtin.assert:
    quiet: true
    that:
      - api_vip is defined and ingress_vip is defined
    fail_msg: "Invalid combination of api_vip and ingress_vip. Both must be defined when lb_type is not 'UserManaged'"
  when: lb_type | default('') != 'UserManaged'
