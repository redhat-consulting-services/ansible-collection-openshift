---
- name: Set bootstrap facts
  ansible.builtin.set_fact:
    cacheable: true
    cluster_name: "{{ cluster_name }}"
    base_domain: "{{ base_domain }}"
    cluster_domain: "{{ cluster_name }}.{{ base_domain }}"
    base_dir: "{{ iso_output_dir }}/{{ cluster_name }}"
    manifest_folder: "{{ iso_output_dir }}/{{ cluster_name }}/manifests"
    kubeconfig_path: "{{ iso_output_dir }}/{{ cluster_name }}/auth/kubeconfig"
    kubeadmin_password_path: "{{ iso_output_dir }}/{{ cluster_name }}/auth/kubeadmin-password"
    bootfile_path: >-
      {%- if iso_type == 'pxe' -%} {{ iso_output_dir }}/{{ cluster_name }}/boot-artifacts/agent.{{ arch }}-*{%- else -%} {{ iso_output_dir }}/{{ cluster_name }}/agent.{{ arch }}.iso{%- endif -%}
    master_node_count: "{{ agent_config.master.hosts | length | default(0) }}"
    worker_node_count: "{{ agent_config.worker.hosts | length | default(0) }}"
    total_node_count: "{{ agent_config.master.hosts | length + agent_config.worker.hosts | length | default(0) }}"

- name: Assert defined properties
  ansible.builtin.include_tasks: assert.yaml

- name: Create output directory structure
  ansible.builtin.file:
    path: "{{ manifest_folder }}"
    state: directory
    mode: '2770'

- name: Generate agent-config.yaml
  ansible.builtin.template:
    src: agent-config.yaml.j2
    dest: "{{ base_dir }}/agent-config.yaml"
    mode: '0660'

- name: Generate install-config.yaml
  ansible.builtin.template:
    src: install-config.yaml.j2
    dest: "{{ base_dir }}/install-config.yaml"
    mode: '0660'

- name: Backup agent-config.yaml manifest file
  ansible.builtin.copy:
    src: "{{ base_dir }}/agent-config.yaml"
    dest: "{{ manifest_folder }}/agent-config.yaml"
    mode: '0660'

- name: Backup agent-config.yaml manifest file
  ansible.builtin.copy:
    src: "{{ base_dir }}/install-config.yaml"
    dest: "{{ manifest_folder }}/install-config.yaml"
    mode: '0660'

#### TODO: remove workaround for https://redhat.atlassian.net/browse/AGENT-626?focusedCommentId=16999187
#### Issue: https://github.com/redhat-consulting-services/ansible-collection-openshift/issues/99
#### Problem:
#### The openshift-install agent create image command does not create the .spec.loadBalancer.type property in the cluster-manifests/agent-cluster-install.yaml file when lb_type is UserManaged.
#### This causes the installation to fail with the following error:
#### - api vips "10.x.x.2" is already in use in cidr 10.x.x.0/24
#### - ingress vips 10.x.x.3 is already in use in cidr 10.x.x.0/24
# --- BEGIN WORKAROUND ---
- name: Create cluster manifests
  changed_when: true
  when: lb_type in ['UserManaged']
  ansible.builtin.command: >
    openshift-install agent create cluster-manifests --dir {{ base_dir }} --log-level=debug
  vars:
    iso_command: "{{ 'image' if iso_type == 'iso' else 'pxe-files' if iso_type == 'pxe' else '' }}"

- name: Add property to LoadBalancer config in cluster-manifests/agent-cluster-install.yaml
  changed_when: true
  when: lb_type in ['UserManaged']
  ansible.builtin.command: >
    yq -i '.spec.loadBalancer.type = "UserManaged"' {{ base_dir }}/cluster-manifests/agent-cluster-install.yaml

- name: Backup cluster-manifests folder
  when: lb_type in ['UserManaged']
  ansible.builtin.copy:
    src: "{{ base_dir }}/cluster-manifests"
    dest: "{{ manifest_folder }}/cluster-manifests"
    mode: '0660'
    remote_src: true

- name: Backup mirror folder
  when: lb_type in ['UserManaged']
  ansible.builtin.copy:
    src: "{{ base_dir }}/mirror"
    dest: "{{ manifest_folder }}/mirror"
    mode: '0660'
    remote_src: true
# --- END WORKAROUND ---

- name: Create the bootable ISO or PXE files
  when: generate_iso | bool
  changed_when: true
  register: result
  ansible.builtin.command: >
    openshift-install agent create {{ iso_command }} --dir {{ base_dir }} --log-level=debug
  vars:
    iso_command: "{{ 'image' if iso_type == 'iso' else 'pxe-files' if iso_type == 'pxe' else '' }}"
  failed_when: iso_command == "" or result.rc != 0
