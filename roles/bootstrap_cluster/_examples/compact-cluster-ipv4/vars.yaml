tenant_name: test-tenant
cluster_name: ocp4-test
base_domain: example.com

lb_type: UserManaged
api_vip:
  - 10.10.10.5
ingress_vip:
  - 10.10.10.6

generate_iso: true
iso_type: "iso"
iso_output_dir: ./iso

additional_ntp_sources:
  - one.ntp.example.com
  - two.ntp.example.com
  - three.ntp.example.com

networking:
  cluster_networks:
    - cidr: "10.128.0.0/14"
      host_prefix: 22
  service_networks:
    - 10.127.0.0/16
  network_type: "OVNKubernetes"
  machine_network:
    - cidr: 10.10.10.0/24

agent_config:
  master:
    dns_resolvers:
      - 10.10.10.1
    routes:
      - destination: 0.0.0.0/0
        gateway: 10.10.10.1
        interface: eth0
        table_id: 254
    hosts:
      - hostname: master-01.hcp1.example.com
        root_device:
          serial_number: "aaaaaaaaaaaaaaaa"
        interfaces:
          - name: eth0
            mac_address: "aa:aa:aa:aa:aa:01"
            addresses:
              - ip: 10.10.10.11
                subnet_length: 24
      - hostname: master-02.hcp1.example.com
        root_device:
          serial_number: "aaaaaaaaaaaaaaaa"
        interfaces:
          - name: eth0
            mac_address: "aa:aa:aa:aa:aa:02"
            addresses:
              - ip: 10.10.10.12
                subnet_length: 24
      - hostname: master-03.hcp1.example.com
        root_device:
          serial_number: "aaaaaaaaaaaaaaaa"
        interfaces:
          - name: eth0
            mac_address: "aa:aa:aa:aa:aa:03"
            addresses:
              - ip: 10.10.10.13
                subnet_length: 24
