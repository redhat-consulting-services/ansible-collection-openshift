---
api_vip:
  - 192.168.50.10
  - 2001:db8::2
  - 192.168.50.12
ingress_vip:
  - 192.168.50.11
  - 2001:db8::3
  - 192.168.50.13
expected_failure_substring: api_vip and ingress_vip must each contain 1 or 2 non-empty IP addresses
agent_config:
  master:
    hostname_prefix: master-
    root_device_name: /dev/sda
    hosts:
      - hostname: master-0
        root_device:
          name: /dev/sda
        interfaces:
          - name: enp0s0
            mac_address: "00:00:00:00:00:01"
  worker:
    hosts: []
