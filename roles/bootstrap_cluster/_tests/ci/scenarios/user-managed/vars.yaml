---
lb_type: UserManaged
type: baremetal
api_vip:
  - 10.10.10.5
  - 2001:db8::5
ingress_vip:
  - 10.10.10.6
  - 2001:db8::6
agent_config:
  master:
    hostname_prefix: master-
    root_device_name: /dev/sda
    hosts:
      - hostname: master-0
        root_device:
          name: /dev/sda
        interfaces:
          - name: enp0s0
            mac_address: "00:00:00:00:00:01"
  worker:
    hosts: []
test_expectations:
  install_config:
    load_balancer_type: UserManaged
    api_vips:
      - 10.10.10.5
      - 2001:db8::5
    ingress_vips:
      - 10.10.10.6
      - 2001:db8::6
  facts:
    master_node_count: 1
    worker_node_count: 0
    total_node_count: 1
    cluster_domain: ocp4-test.ocp4.example.com
    base_dir: "{{ scenario_output_dir }}/ocp4-test"
    manifest_folder: "{{ scenario_output_dir }}/ocp4-test/manifests"
    kubeconfig_path: "{{ scenario_output_dir }}/ocp4-test/auth/kubeconfig"
    kubeadmin_password_path: "{{ scenario_output_dir }}/ocp4-test/auth/kubeadmin-password"
