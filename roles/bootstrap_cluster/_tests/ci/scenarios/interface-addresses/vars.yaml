---
api_vip: 192.168.50.10
ingress_vip: 192.168.50.11
agent_config:
  master:
    hostname_prefix: master-
    root_device_name: /dev/sda
    dns_resolvers:
      - 172.16.11.1
    routes:
      - destination: 0.0.0.0/0
        gateway: 192.168.50.1
        interface: enp0s0
        table_id: 254
    hosts:
      - hostname: master-0
        root_device:
          name: /dev/sda
        interfaces:
          - name: enp0s0
            mac_address: "00:00:00:00:00:01"
            addresses:
              - ip: 192.168.50.20
                subnet_length: 24
      - hostname: master-1
        root_device:
          name: /dev/sda
        interfaces:
          - name: enp0s0
            mac_address: "00:00:00:00:00:02"
            addresses:
              - ip: 192.168.50.21
                subnet_length: 24
      - hostname: master-2
        root_device:
          name: /dev/sda
        interfaces:
          - name: enp0s0
            mac_address: "00:00:00:00:00:03"
            addresses:
              - ip: 192.168.50.22
                subnet_length: 24
  worker:
    hosts: []
test_expectations:
  install_config:
    api_vips:
      - 192.168.50.10
    ingress_vips:
      - 192.168.50.11
  facts:
    master_node_count: 3
    worker_node_count: 0
    total_node_count: 3
    cluster_domain: ocp4-test.ocp4.example.com
    base_dir: "{{ scenario_output_dir }}/ocp4-test"
    manifest_folder: "{{ scenario_output_dir }}/ocp4-test/manifests"
    kubeconfig_path: "{{ scenario_output_dir }}/ocp4-test/auth/kubeconfig"
    kubeadmin_password_path: "{{ scenario_output_dir }}/ocp4-test/auth/kubeadmin-password"
  agent_config:
    interfaces:
      - name: enp0s0
        ipv4_enabled: true
        ipv4_dhcp: false
        ipv6_enabled: false
        ipv6_dhcp: false
        ipv4_addresses:
          - 192.168.50.20
        ipv4_prefix_lengths:
          - 24
