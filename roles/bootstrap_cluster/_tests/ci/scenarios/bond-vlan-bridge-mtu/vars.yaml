---
api_vip: 192.168.50.10
ingress_vip: 192.168.50.11
agent_config:
  master:
    hostname_prefix: master-
    root_device_name: /dev/sda
    dns_resolvers:
      - 10.10.10.2
    routes:
      - destination: 0.0.0.0/0
        gateway: 10.10.10.1
        interface: bond0.100
        table_id: 254
    bonds:
      - name: bond0
        mode: 802.3ad
        mtu: 9000
        options:
          miimon: "100"
    vlans:
      - name: bond0.100
        id: 100
        base_interface: bond0
        mtu: 9000
    bridges:
      - name: br0
        type: linux-bridge
        mtu: 1500
        interfaces:
          - name: bond0.100
    hosts:
      - hostname: master-0
        root_device:
          name: /dev/sda
        interfaces:
          - name: enp0s0
            mac_address: "00:00:00:00:00:01"
            part_of_bond: bond0
            mtu: 9000
          - name: enp0s1
            mac_address: "00:00:00:00:00:02"
            part_of_bond: bond0
            mtu: 9000
        bonds:
          - interface: bond0
            ipv4_dhcp: false
            ipv6_dhcp: false
        vlans:
          - interface: bond0.100
            ipv4_dhcp: false
            ipv6_dhcp: false
            addresses:
              - ip: 10.10.10.10
                subnet_length: 24
      - hostname: master-1
        root_device:
          name: /dev/sda
        interfaces:
          - name: enp0s0
            mac_address: "00:00:00:00:00:03"
            part_of_bond: bond0
            mtu: 9000
          - name: enp0s1
            mac_address: "00:00:00:00:00:04"
            part_of_bond: bond0
            mtu: 9000
        bonds:
          - interface: bond0
            ipv4_dhcp: false
            ipv6_dhcp: false
        vlans:
          - interface: bond0.100
            ipv4_dhcp: false
            ipv6_dhcp: false
            addresses:
              - ip: 10.10.10.11
                subnet_length: 24
      - hostname: master-2
        root_device:
          name: /dev/sda
        interfaces:
          - name: enp0s0
            mac_address: "00:00:00:00:00:05"
            part_of_bond: bond0
            mtu: 9000
          - name: enp0s1
            mac_address: "00:00:00:00:00:06"
            part_of_bond: bond0
            mtu: 9000
        bonds:
          - interface: bond0
            ipv4_dhcp: false
            ipv6_dhcp: false
        vlans:
          - interface: bond0.100
            ipv4_dhcp: false
            ipv6_dhcp: false
            addresses:
              - ip: 10.10.10.12
                subnet_length: 24
  worker:
    hostname_prefix: worker-
    root_device_name: /dev/sda
    dns_resolvers:
      - 10.10.10.2
    routes:
      - destination: 0.0.0.0/0
        gateway: 10.10.10.1
        interface: bond0.100
        table_id: 254
    bonds:
      - name: bond0
        mode: 802.3ad
        mtu: 9000
        options:
          miimon: "100"
    vlans:
      - name: bond0.100
        id: 100
        base_interface: bond0
        mtu: 9000
    bridges:
      - name: br0
        type: linux-bridge
        mtu: 1500
        interfaces:
          - name: bond0.100
    hosts:
      - hostname: worker-0
        root_device:
          name: /dev/sda
        interfaces:
          - name: enp0s0
            mac_address: "00:00:00:00:00:07"
            part_of_bond: bond0
            mtu: 9000
          - name: enp0s1
            mac_address: "00:00:00:00:00:08"
            part_of_bond: bond0
            mtu: 9000
        bonds:
          - interface: bond0
            ipv4_dhcp: false
            ipv6_dhcp: false
        vlans:
          - interface: bond0.100
            ipv4_dhcp: false
            ipv6_dhcp: false
            addresses:
              - ip: 10.10.10.20
                subnet_length: 24
test_expectations:
  facts:
    master_node_count: 3
    worker_node_count: 1
    total_node_count: 4
    cluster_domain: ocp4-test.ocp4.example.com
    base_dir: "{{ scenario_output_dir }}/ocp4-test"
    manifest_folder: "{{ scenario_output_dir }}/ocp4-test/manifests"
    kubeconfig_path: "{{ scenario_output_dir }}/ocp4-test/auth/kubeconfig"
    kubeadmin_password_path: "{{ scenario_output_dir }}/ocp4-test/auth/kubeadmin-password"
  agent_config:
    dns_resolvers:
      - 10.10.10.2
    routes:
      - destination: 0.0.0.0/0
        gateway: 10.10.10.1
    interfaces:
      - name: enp0s0
        mtu: 9000
        ipv4_enabled: false
        ipv4_dhcp: false
        ipv6_enabled: false
        ipv6_dhcp: false
      - name: enp0s1
        mtu: 9000
        ipv4_enabled: false
        ipv4_dhcp: false
        ipv6_enabled: false
        ipv6_dhcp: false
      - name: bond0
        mtu: 9000
        ipv4_enabled: false
        ipv4_dhcp: false
        ipv6_enabled: false
        ipv6_dhcp: false
      - name: br0
        mtu: 1500
      - name: bond0.100
        mtu: 9000
        ipv4_enabled: true
        ipv4_dhcp: false
        ipv6_enabled: false
        ipv6_dhcp: false
        ipv4_addresses:
          - 10.10.10.10
        ipv4_prefix_lengths:
          - 24
