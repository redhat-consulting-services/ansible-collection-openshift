---
mirror:
  enabled: false
  destination:
    auth_config: |
      {
        "auths": {
          "quay.io": {
            "auth": "cXVheW9fY2xpOjEyMzQ1Njc4OTA="
          }
        }
      }
  source:
    auth_config: |
      {
        "auths": {
          "registry.redhat.io": {
            "auth": "cmVnaXN0cnlfY2xpOjEyMzQ1Njc4OTA="
          }
        }
      }

image_sets:
  - name: openshift-additional
    enabled: true
    destination: ocp-additional
    additional_images:
      - name: registry.redhat.io/ubi9/ubi:latest
      - name: registry.redhat.io/openshift4/ose-cli:latest

  - name: ocp4
    enabled: true
    destination: platform
    platform:
      channels:
        - name: stable-4.22
          min_version: 4.22.7
          max_version: 4.22.7
          shortestPath: true
          type: ocp

  - name: openshift-operators
    destination: operators
    platform:
      architectures:
        - amd64
      channels:
        - name: stable-4.22
          min_version: 4.22.7
          max_version: 4.22.7
          shortestPath: true
          type: ocp
    operators:
      - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.22
        packages:
          - name: advanced-cluster-management
          - name: multicluster-engine
          - name: rhacs-operator
          - name: compliance-operator
          - name: openshift-gitops-operator
          - name: cluster-logging

  - name: community-operators
    operators:
      - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.22
        packages:
          - name: advanced-cluster-management
          - name: multicluster-engine
          - name: rhacs-operator
          - name: compliance-operator
          - name: openshift-gitops-operator
          - name: cluster-logging
