kubeconfig_path: "~/.kube/config"

app_of_apps:
  # enable or disable the App of Apps application definition creation
  enabled: true
  # name of the App of Apps application
  name: app-of-apps
  # project for the App of Apps application
  project: default
  # source defines where to find the App of Apps manifests
  source:
    # repo URL for the App of Apps application
    repo: https://gitlab.example/openshift/openshift-configurations.git
    # target_revision for the App of Apps application (e.g., branch, tag, commit)
    target_revision: main
    # path within the repo for the App of Apps application
    path: overlays/app-of-apps
  sync_policy:
    automated:
      prune: true
      selfHeal: true
    sync_options:
      - Validate=false

repositories:
  - name: app-of-apps
    type: git
    url: https://gitlab.example.com/openshift/openshift-configurations.git
    authentication:
      username: "a-username"
      password: "a-password"

  - name: app-of-apps-ssh-repo
    type: git
    url: git@gitlab.example.com:openshift/openshift-configurations.git
    authentication:
      private_key: "a-private-key"

  - name: app-of-apps-github-app
    type: git
    url: https://github.com/openshift/openshift-configurations.git
    authentication:
      github:
        app_id: "12345"
        app_installation_id: "67890"
        private_key: "a-github-app-private-key"

  - name: app-of-apps-github-enterprise
    type: git
    url: https://github.example.com/openshift/openshift-configurations.git
    authentication:
      github:
        app_id: "12345"
        app_installation_id: "67890"
        private_key: "a-ghe-app-private-key"
        enterprise_base_url: https://github.example.com/api/v3

  - name: app-of-apps-helm-oci-repo
    type: helm
    url: https://registry.example.com/openshift/helm-charts
    enableOCI: true
    authentication:
      username: "a-username"
      password: "a-password"

  - name: app-of-apps-helm-tls
    type: helm
    url: https://helm.internal.example.com/
    authentication:
      tls_client_cert:
        cert_data: "<|cert_data|>"
        cert_key: "<|cert_key|>"

  - name: team-b-creds
    type: git
    url: https://git.example.com/team-b/
    secret_type: repo-creds
    project: team-b
    authentication:
      username: deploy-token
      password: "<|password|>"
