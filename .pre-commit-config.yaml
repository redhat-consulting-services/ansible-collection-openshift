---
fail_fast: true
repos:
  # Lint YAML and Ansible playbooks
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.11.0
    hooks:
      - id: ansible-lint
        pass_filenames: true
        files: (^|/)\.ansible-lint$|\.ya?ml$
        exclude: ^examples/

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # Trailing whitespace, newline, merge conflict, and executable checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: check-executables-have-shebangs

  # Enforce Signed-off-by in commit messages
  - repo: local
    hooks:
      - id: require-signed-off-by
        name: Require Signed-off-by
        entry: bash -c 'grep -q "^Signed-off-by:" "$1" || { echo "Commit must include Signed-off-by trailer"; exit 1; }' --
        language: system
        stages: [commit-msg]
        always_run: true
