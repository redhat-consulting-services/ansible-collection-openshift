name: Role Integration Tests

on:
  push:
    branches:
      - main
    paths:
      - "roles/**"
      - "tests/**"
      - "meta/**"
      - "galaxy.yml"
      - "Makefile"
      - ".github/workflows/test.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "roles/**"
      - "tests/**"
      - "meta/**"
      - "galaxy.yml"
      - "Makefile"
      - ".github/workflows/test.yaml"
  workflow_dispatch:

jobs:
  role-tests:
    name: Role option matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.18.0,<2.20" PyYAML

      - name: Run role integration tests
        run: make test

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.18.0,<2.20" ansible-lint

      - name: Lint collection
        run: make ansible-lint
