name: Build Execution Environment

on:
  workflow_call:
    inputs:
      push:
        description: "Push the built image to the registry"
        required: true
        type: boolean
      version:
        description: "Version of the collection. The galaxy.yml will be updated with this version. A commit is not created."
        required: true
        type: string
      ee_registry_url:
        description: "URL for the execution environment registry"
        required: true
        type: string
      ee_image_repo:
        description: "Repository for the execution environment image"
        required: true
        type: string
    secrets:
      registry_redhat_io_username:
        description: "Username for registry.redhat.io"
        required: true
      registry_redhat_io_password:
        description: "Password for registry.redhat.io"
        required: true
      ee_registry_username:
        description: "Username for the execution environment registry"
        required: true
      ee_registry_password:
        description: "Password for the execution environment registry"
        required: true
    outputs:
      combined:
        description: "Combined output of all built image tags"
        value: ${{ jobs.aggregate.outputs.combined }}
      combined_tags:
        description: "Combined output of all built image tags (without latest tags)"
        value: ${{ jobs.aggregate.outputs.combined_tags }}
      combined_latest_tags:
        description: "Combined output of all built image latest tags"
        value: ${{ jobs.aggregate.outputs.combined_latest_tags }}

env:
  IMAGE_NAME: quay.io/${{ vars.QUAY_IO_REPO }}

jobs:
  generate-timestamp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
    steps:
      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  version-informations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      openshift_versions: ${{ steps.get-versions.outputs.openshift_versions }}
      publish_matrix: ${{ steps.get-versions.outputs.publish_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get OpenShift versions
        id: get-versions
        run: |
          # Build every version, payload, and host architecture combination.
          echo "openshift_versions=$(jq -c '. + {"architecture":["amd64","arm64"],"payload":["amd64","arm64","multi"]}' .github/openshift-versions.json)" >> "$GITHUB_OUTPUT"
          # Publish one multi-platform manifest for each version and payload.
          echo "publish_matrix=$(jq -c '. + {"payload":["amd64","arm64","multi"]}' .github/openshift-versions.json)" >> "$GITHUB_OUTPUT"

  build:
    # Build on a native runner for the image platform.
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    needs:
      - generate-timestamp
      - version-informations
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      # Avoid overwhelming the OpenShift mirror with large concurrent downloads.
      max-parallel: 6
      matrix: ${{ fromJson(needs.version-informations.outputs.openshift_versions) }}
    steps:
      - name: Debug output
        run: |
          echo "OpenShift version: ${{ matrix.openshift_versions }}"
          echo "Push: ${{ inputs.push }}"
          echo "Version: ${{ inputs.version }}"
          echo "EE Registry URL: ${{ inputs.ee_registry_url }}"
          echo "EE Image Repo: ${{ inputs.ee_image_repo }}"
          echo "Image Name: ${{ env.IMAGE_NAME }}"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      - name: Login to registry.redhat.io
        uses: docker/login-action@v3
        with:
          registry: registry.redhat.io
          username: ${{ secrets.registry_redhat_io_username }}
          password: ${{ secrets.registry_redhat_io_password }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ansible-builder
        run: |
          pip install ansible-builder

      - name: Set image tag
        id: image_tag
        run: |
          # Preserve the original unqualified tags for the amd64/amd64 case.
          prefix="${{ env.IMAGE_NAME }}:${{ inputs.version }}-ocp-${{ matrix.openshift_versions }}"
          if [ "${{ matrix.architecture }}-${{ matrix.payload }}" = "amd64-amd64" ]; then
            echo "tag=${prefix}-${{ needs.generate-timestamp.outputs.timestamp }}" >> "$GITHUB_OUTPUT"
            echo "latest_tag=${prefix}-latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${prefix}-${{ needs.generate-timestamp.outputs.timestamp }}-${{ matrix.payload }}" >> "$GITHUB_OUTPUT"
            echo "latest_tag=${prefix}-${{ matrix.payload }}-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Release Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.ee_registry_url }}
          username: ${{ secrets.ee_registry_username }}
          password: ${{ secrets.ee_registry_password }}

      - uses: actions/download-artifact@v5
        if: ${{ !inputs.push }}
        with:
          name: ansible-collection
          path: ./collections

      - name: List collection files
        if: ${{ !inputs.push }}
        run: |
          ls -l ./collections

      - name: Determine requirements yaml file
        if: ${{ !inputs.push }}
        run: |
          cp ee-requirements.dev.yml ee-requirements.yml
          cp execution-environment.dev.yml execution-environment.yml

      - name: Generate execution environment build context
        run: |
          # Generate one Dockerfile that is reused by the digest and validation builds.
          ansible-builder create --output-filename Dockerfile --context .

      # Push each platform without a tag; the publish job creates the tagged manifests.
      - name: Build and push platform image by digest
        if: ${{ inputs.push || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          docker buildx build \
            --platform linux/${{ matrix.architecture }} \
            --build-arg OPENSHIFT_VERSION=${{ matrix.openshift_versions }} \
            --build-arg OPENSHIFT_PAYLOAD_ARCH=${{ matrix.payload }} \
            --output type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true \
            --metadata-file build-metadata.json .
          jq -er '."containerimage.digest"' build-metadata.json > image-digest.txt
          image="${{ env.IMAGE_NAME }}@$(cat image-digest.txt)"
          docker pull "$image"
          docker run --rm --entrypoint openshift-install "$image" version
          docker run --rm --entrypoint oc "$image" version --client
          docker run --rm --entrypoint kubectl "$image" version --client
          docker run --rm --entrypoint oc-mirror "$image" --v2 version

      - name: Upload platform image digest
        if: ${{ inputs.push || startsWith(github.ref, 'refs/tags/v') }}
        # The publish job combines these per-platform digests into manifests.
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.openshift_versions }}-${{ matrix.payload }}-${{ matrix.architecture }}
          path: image-digest.txt
          retention-days: 1
          if-no-files-found: error

      - name: Build and load execution environment for validation
        if: ${{ !inputs.push }}
        run: |
          # Load this single-platform image locally and smoke-test it without publishing.
          tag="${{ steps.image_tag.outputs.tag }}"
          docker buildx build \
            --platform linux/${{ matrix.architecture }} \
            --build-arg OPENSHIFT_VERSION=${{ matrix.openshift_versions }} \
            --build-arg OPENSHIFT_PAYLOAD_ARCH=${{ matrix.payload }} \
            --tag "$tag" --load .
          docker run --rm --entrypoint openshift-install "$tag" version
          docker run --rm --entrypoint oc "$tag" version --client
          docker run --rm --entrypoint kubectl "$tag" version --client
          docker run --rm --entrypoint oc-mirror "$tag" --v2 version
          mkdir container-images
          if [ "${{ matrix.architecture }}-${{ matrix.payload }}" = "amd64-amd64" ]; then
            docker tag "$tag" "${{ steps.image_tag.outputs.latest_tag }}"
            docker save -o container-images/container-images.tar \
              "$tag" "${{ steps.image_tag.outputs.latest_tag }}"
          else
            docker save -o container-images/container-images.tar "$tag"
          fi

      # - name: Run Trivy vulnerability scanner
      #   if: ${{ !inputs.push }}
      #   uses: aquasecurity/trivy-action@0.28.0
      #   with:
      #     image-ref: '${{ steps.image_tag.outputs.tag }}'
      #     format: 'table'
      #     exit-code: '1'
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL,HIGH'

      - name: Upload execution environment artifact
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.architecture == 'amd64' && matrix.payload == 'amd64' && format('ansible-execution-environment-{0}-ocp-{1}', inputs.version, matrix.openshift_versions) || format('ansible-execution-environment-{0}-ocp-{1}-payload-{2}-host-{3}', inputs.version, matrix.openshift_versions, matrix.payload, matrix.architecture) }}
          path: container-images/
          retention-days: 1
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
      - generate-timestamp
      - version-informations
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.version-informations.outputs.publish_matrix) }}
    steps:
      - name: Download image digests
        if: ${{ inputs.push || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v5
        with:
          pattern: digest-${{ matrix.openshift_versions }}-*
          path: digests

      - name: Login to release registry
        if: ${{ inputs.push || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.ee_registry_url }}
          username: ${{ secrets.ee_registry_username }}
          password: ${{ secrets.ee_registry_password }}

      - name: Set up Docker Buildx
        if: ${{ inputs.push || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-architecture tags
        if: ${{ inputs.push || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          prefix="${{ env.IMAGE_NAME }}:${{ inputs.version }}-ocp-${{ matrix.openshift_versions }}"
          # Create a payload-specific manifest from both host-platform images.
          amd64=$(cat "digests/digest-${{ matrix.openshift_versions }}-${{ matrix.payload }}-amd64/image-digest.txt")
          arm64=$(cat "digests/digest-${{ matrix.openshift_versions }}-${{ matrix.payload }}-arm64/image-digest.txt")
          docker buildx imagetools create \
            -t "${prefix}-${{ needs.generate-timestamp.outputs.timestamp }}-${{ matrix.payload }}" \
            -t "${prefix}-${{ matrix.payload }}-latest" \
            "${{ env.IMAGE_NAME }}@$amd64" "${{ env.IMAGE_NAME }}@$arm64"
          if [ "${{ matrix.payload }}" = amd64 ]; then
            # Keep the legacy tags native to each selected host architecture.
            native_arm64=$(cat "digests/digest-${{ matrix.openshift_versions }}-arm64-arm64/image-digest.txt")
            docker buildx imagetools create \
              -t "${prefix}-${{ needs.generate-timestamp.outputs.timestamp }}" \
              -t "${prefix}-latest" \
              "${{ env.IMAGE_NAME }}@$amd64" "${{ env.IMAGE_NAME }}@$native_arm64"
          fi

      - name: Create version files
        run: |
          prefix="${{ env.IMAGE_NAME }}:${{ inputs.version }}-ocp-${{ matrix.openshift_versions }}"
          echo "${prefix}-${{ needs.generate-timestamp.outputs.timestamp }}-${{ matrix.payload }}" > version-tag-${{ matrix.openshift_versions }}-${{ matrix.payload }}.txt
          echo "${prefix}-${{ matrix.payload }}-latest" > version-latest-${{ matrix.openshift_versions }}-${{ matrix.payload }}.txt
          if [ "${{ matrix.payload }}" = amd64 ]; then
            echo "${prefix}-${{ needs.generate-timestamp.outputs.timestamp }}" >> version-tag-${{ matrix.openshift_versions }}-${{ matrix.payload }}.txt
            echo "${prefix}-latest" >> version-latest-${{ matrix.openshift_versions }}-${{ matrix.payload }}.txt
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: outputs-${{ matrix.openshift_versions }}-${{ matrix.payload }}
          path: |
            version-tag-${{ matrix.openshift_versions }}-${{ matrix.payload }}.txt
            version-latest-${{ matrix.openshift_versions }}-${{ matrix.payload }}.txt

  aggregate:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
    outputs:
      combined: ${{ steps.aggregate.outputs.combined }}
      combined_tags: ${{ steps.aggregate.outputs.combined_tags }}
      combined_latest_tags: ${{ steps.aggregate.outputs.combined_latest_tags }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: outputs-*

      - name: Aggregate outputs
        id: aggregate
        run: |
          cat ./*/version-tag-*.txt > combined-tags.txt
          cat ./*/version-latest-*.txt > combined-latest-tags.txt

          {
            echo "combined_tags<<EOF"
            cat combined-tags.txt
            echo "EOF"
            echo "combined_latest_tags<<EOF"
            cat combined-latest-tags.txt
            echo "EOF"
            echo "combined<<EOF"
            cat combined-latest-tags.txt combined-tags.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
