---
name: 01_search_filter_labels_and_taints
vars:
  node_filter_type: search
  node_filter_pattern: worker
  node_labels:
    node-role.kubernetes.io/infra: ""
    workload: gpu
  node_taints:
    - key: node-role.kubernetes.io/infra
      effect: NoSchedule
seed_resources:
  - kind: Node
    metadata:
      name: master-0
  - kind: Node
    metadata:
      name: worker-0
  - kind: Node
    metadata:
      name: worker-1
  - kind: Node
    metadata:
      name: infra-0
assertions:
  - k8s_patch_calls | length == 2
  - >-
      (k8s_patch_calls | map(attribute='name') | list | sort)
      == ['worker-0', 'worker-1']
  - >-
      k8s_patch_calls[0].definition.metadata.labels['node-role.kubernetes.io/infra'] == ''
  - >-
      k8s_patch_calls[0].definition.spec.taints[0].key == 'node-role.kubernetes.io/infra'
