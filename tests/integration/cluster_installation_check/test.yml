---
- name: Test cluster_installation_check role
  hosts: localhost
  gather_facts: false
  vars:
    kubeconfig_path: "{{ test_artifact_dir }}/kubeconfig"
    base_dir: "{{ test_artifact_dir }}/install"
    case_file:
      path: "{{ case_file_path }}"
  tasks:
    - name: Create install directory and kubeconfig
      ansible.builtin.file:
        path: "{{ base_dir }}/auth"
        state: directory
        mode: "0755"

    - name: Write dummy kubeconfig
      ansible.builtin.copy:
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Config
          clusters: []
          contexts: []
          users: []

    - name: Run case
      ansible.builtin.include_tasks: run_case.yml
