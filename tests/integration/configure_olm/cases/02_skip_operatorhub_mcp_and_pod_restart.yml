---
name: 02_skip_operatorhub_mcp_and_pod_restart
vars:
  registry:
    url: registry.internal.example
    repository: ""
    index: custom-index
  catalog_source:
    ocp_version: "4.18"
    name: custom-operators
  operator_hub:
    manage: false
    disable_default_sources: false
  olm:
    marketplace_namespace: openshift-marketplace
    pods:
      restart: false
      wait_for_ready: false
      restart_timeout: 30
      label_selectors:
        - olm.catalogSource
  machine_config_pool:
    watch_updates: false
    wait_for_completion: false
    timeout: 30
    interval: 1
    pool_names:
      - master
seed_resources: []
assertions:
  - >-
      (mock_calls | selectattr('module', 'equalto', 'k8s_json_patch') | list | length) == 0
  - >-
      (mock_resources | selectattr('kind', 'equalto', 'CatalogSource') | first).metadata.name
      == 'custom-operators'
  - >-
      (mock_resources | selectattr('kind', 'equalto', 'CatalogSource') | first).spec.image
      == 'registry.internal.example/custom-index:4.18'
  - >-
      (mock_resources | selectattr('kind', 'equalto', 'ImageDigestMirrorSet')
       | selectattr('metadata.name', 'equalto', 'idms-ocp4') | first)
      .spec.imageDigestMirrors[0].mirrors[0]
      == 'registry.internal.example/openshift/release-images'
  - >-
      (mock_calls | selectattr('module', 'equalto', 'k8s_info')
       | selectattr('kind', 'equalto', 'MachineConfigPool') | list | length) == 0
  - >-
      (mock_calls | selectattr('module', 'equalto', 'k8s_info')
       | selectattr('kind', 'equalto', 'Pod') | list | length) == 0
