---
name: 03_disable_default_sources_false
vars:
  registry:
    url: mirror.example.com
    repository: ocp
    index: redhat-operator-index
  catalog_source:
    ocp_version: "4.19"
    name: redhat-operators
  operator_hub:
    manage: true
    disable_default_sources: false
  olm:
    marketplace_namespace: openshift-marketplace
    pods:
      restart: false
      wait_for_ready: false
      restart_timeout: 30
      label_selectors:
        - olm.catalogSource
  machine_config_pool:
    watch_updates: false
    wait_for_completion: false
    timeout: 30
    interval: 1
    pool_names: []
seed_resources: []
assertions:
  - >-
      (mock_calls | selectattr('module', 'equalto', 'k8s_json_patch') | first).patch[0].value | bool == false
  - >-
      (mock_resources | selectattr('kind', 'equalto', 'ImageDigestMirrorSet')
       | selectattr('metadata.name', 'equalto', 'idms-gitops') | first)
      .spec.imageDigestMirrors[0].mirrors[0]
      == 'mirror.example.com/ocp/openshift-gitops-1'
